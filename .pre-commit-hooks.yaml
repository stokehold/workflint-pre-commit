# Installs workflint from PyPI, so the hook needs no Rust toolchain. The
# stokehold/workflint repository has a language: system hook, workflint-system,
# for workflint installed in any other way. Both use the files and types
# filters of actionlint's hooks. require_serial runs one workflint process on
# all the files, since workflint runs in parallel itself and resolves reusable
# workflows across files.
- id: workflint
  name: Lint GitHub Actions workflow files
  description: Runs workflint from PyPI to lint GitHub Actions workflow files
  language: python
  entry: workflint
  files: ^\.github/workflows/
  types: [yaml]
  require_serial: true
  minimum_pre_commit_version: 3.0.0
